version: 2
updates:
  # Monthly, one grouped PR for minor/patch; majors arrive separately so they
  # can be tested on their own.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node runtime (24, see Dockerfile + CI). Bump by hand
      # together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # All action bumps in a single PR so ci.yml edits never conflict.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
