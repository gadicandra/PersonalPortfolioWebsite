services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Email (Resend) — pulled from host .env. Required for the contact form.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-}"
      CONTACT_FROM: "${CONTACT_FROM:-}"
    ports:
      - "3000:3000"
